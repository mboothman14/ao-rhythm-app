<title>AO Year 2 Rhythm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --ink:#1E2A22; --muted:#66746A; --line:#D8DED5;
  --accent:#3F6B4A; --accent-ink:#FFFFFF; --accent-soft:#E4EEE6; --term:#A8781F; --term-soft:#F6EEDC;
  --done:#8A968D; --focus:#2F5A3B; --shadow:0 1px 2px rgba(30,42,34,.08);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A16; --surface:#1D2620; --ink:#E8EDE6; --muted:#98A69B; --line:#2E3A31;
  --accent:#7FB58E; --accent-ink:#0F1A12; --accent-soft:#233127; --term:#D9A94B; --term-soft:#2E2818;
  --done:#6E7B71; --focus:#A6D2B2; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1D2620; --ink:#E8EDE6; --muted:#98A69B; --line:#2E3A31;
  --accent:#7FB58E; --accent-ink:#0F1A12; --accent-soft:#233127; --term:#D9A94B; --term-soft:#2E2818;
  --done:#6E7B71; --focus:#A6D2B2; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 96px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px;margin:0 -14px 14px}
.top-row{display:flex;align-items:center;gap:8px;max-width:612px;margin:0 auto}
.step{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.step:disabled{opacity:.35}
.step svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{flex:1;min-width:0;text-align:center}
.title h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.01em}
.title .sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .3s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.sync{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.sync b{font-weight:600;color:var(--accent)}

/* sections */
section{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px;padding:0 2px}
.sec-head h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.sec-head .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:start;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.chk{width:44px;height:52px;display:grid;place-items:center;align-self:stretch}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:14px;height:14px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .box svg{opacity:1}
.item.term .box{border-color:var(--term)}
.item.term.done .box{background:var(--term);border-color:var(--term)}
.body{padding:12px 4px 12px 0;min-width:0}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.item.term .label{color:var(--term)}
.text{font-size:16px;font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.item.done .text{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.text a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.text a:hover{border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.hint a{color:var(--accent);text-decoration:none}
.hint a+a::before{content:"·";color:var(--muted);margin:0 6px}
.tools{display:flex;padding:8px 6px 0 0;gap:2px}
.tb{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tb:hover{background:var(--accent-soft);color:var(--accent)}
.tb.on{color:var(--accent)}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.note{grid-column:2/4;padding:0 12px 12px 0}
.note textarea,.weeknote textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.note[hidden]{display:none}
.notepeek{font-size:14px;color:var(--ink);margin-top:4px;padding:6px 10px;background:var(--term-soft);border-radius:6px;white-space:pre-wrap}
.item:not(.term) .notepeek{background:var(--accent-soft)}

/* day tabs */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.day{padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:center;font-weight:600;font-size:14px}
.day small{display:block;font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.active small{color:var(--accent-ink);opacity:.8}
.day.complete:not(.active){border-color:var(--accent);color:var(--accent)}

/* week note & footer */
.weeknote textarea{min-height:110px}
.foot{font-size:13px;color:var(--muted);line-height:1.5;padding:0 2px}
.foot a{color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* overview */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:14px}
.overlay[hidden]{display:none}
.ov-head{display:flex;justify-content:space-between;align-items:center;max-width:612px;margin:0 auto 12px}
.ov-head h2{font-family:var(--display);font-size:24px;margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:612px;margin:0 auto 18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;text-align:center;position:relative;overflow:hidden}
.tile b{font-family:var(--display);font-size:20px;font-weight:500;display:block}
.tile small{color:var(--muted);font-size:11px;display:block}
.tile .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.tile.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.term-lbl{max-width:612px;margin:0 auto 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--term);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="top-row">
      <button class="step" id="prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="title" id="openOverview" aria-label="Open week overview">
        <h1 id="wkTitle">Week 1</h1>
        <div class="sub" id="wkSub"></div>
      </button>
      <div class="ring" aria-hidden="true"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="fill" id="ringFill" cx="22" cy="22" r="18" stroke-dasharray="0 113.1"/></svg><span id="ringPct">0%</span></div>
      <button class="step" id="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="sync" id="sync">Connecting…</div>
  </div>

  <section>
    <div class="sec-head"><h2>Daily rhythm</h2><span class="count" id="dayCount"></span></div>
    <div class="days" id="days"></div>
    <div class="list" id="dayList"></div>
  </section>

  <section>
    <div class="sec-head"><h2>This week's readings</h2><span class="count" id="readCount"></span></div>
    <div class="list" id="readList"></div>
  </section>

  <section>
    <div class="sec-head"><h2 id="termTitle">Term rotation</h2><span class="count" id="termCount"></span></div>
    <div class="list" id="termList"></div>
  </section>

  <section class="weeknote">
    <div class="sec-head"><h2>Week notes</h2></div>
    <textarea id="weekNote" placeholder="How the week went, what to carry forward, narrations worth remembering…"></textarea>
    <div class="actions">
      <button class="btn primary" id="shareBtn">Share with family</button>
      <button class="btn" id="resetWeek">Clear this week's checks</button>
    </div>
  </section>

  <p class="foot">Each block on the schedule is about 15 minutes. Pilgrim's Progress runs 800 words a week. Full schedule and book list at <a id="schedLink" target="_blank" rel="noopener">amblesideonline.org</a>. Free reads: <span id="freeReads"></span>.</p>
</div>

<div class="overlay" id="overview" hidden>
  <div class="ov-head"><h2>36 weeks</h2><button class="btn" id="closeOverview">Close</button></div>
  <div id="ovBody"></div>
</div>

w.amblesideonline.org/poet-field","riley":"https://www.amblesideonline.org/poet-riley","rossetti":"https://www.amblesideonline.org/poet-rossetti","composers":"https://www.amblesideonline.org/composers","folksongs":"https://www.amblesideonline.org/folksongs","hymns":"https://www.amblesideonline.org/hymns","nature":"https://www.amblesideonline.org/nature-study","artists":"https://www.amblesideonline.org/artists","sched":"https://www.amblesideonline.org/ao-y2-sch","hns":"https://www.gutenberg.org/ebooks/78142"},"terms":{"1":{"name":"Term 1","weeks":"Weeks 1-12","recitation":["Genesis 1:1","Matthew 4:23","Hebrews 13:8","The Cupboard by Walter de la Mare","Silver by Walter de la Mare"],"geography":[["Long's Home Geography, Ch 4 and CM's Elementary Geography, both compass chapters (spread over term)","http://www.gutenberg.org/ebooks/12228"],["CM's Elementary Geography","https://www.amblesideonline.org/elementary-geography"]]},"2":{"name":"Term 2","weeks":"Weeks 13-24","recitation":["Matthew 19:26","Matthew 20:28","Psalm 145:8","The Duel by Eugene Field","The Prayer Perfect by James Whitcomb Riley"],"geography":[["CM's Elementary Geography: Our World and Other Worlds, Pt 1 and 2; Day and Night (spread over term)","https://www.amblesideonline.org/elementary-geography"]]},"3":{"name":"Term 3","weeks":"Weeks 25-36","recitation":["Matthew 23:11-12","Matthew 28:19-20","Psalm 37:5","What is pink? a rose is pink by Christina Rossetti","Who has seen the wind? by Christina Rossetti"],"geography":[["CM's Elementary Geography: Poles and Axis; Four Seasons Pt 1 and 2 (spread over term)","https://www.amblesideonline.org/elementary-geography"]]}}}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg>';
  const ICON_LINK = '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
  const ICON_NOTE = '<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M12.5 7.5l4 4"/></svg>';

  // ---------- state ----------
  let week = 1, day = 1, db = null, unsub = null, useDb = false;
  let state = blank();          // {checks:{}, notes:{}, weekNote:""}
  let overviewCache = {};       // weekNum -> percent (from db or local)
  const noteTimers = {};
  function blank(){ return {checks:{}, notes:{}, weekNote:""}; }
  function key(n){ return 'w' + String(n).padStart(2,'0'); }
  function ls(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

  // choose starting week: last viewed, else week 1
  const saved = parseInt(ls('ao2.week') || '1', 10);
  if (saved >= 1 && saved <= 36) week = saved;
  const savedDay = parseInt(ls('ao2.day') || '0', 10);
  day = (savedDay >= 1 && savedDay <= 5) ? savedDay : Math.min(5, Math.max(1, (new Date().getDay()) || 1));

  // ---------- item model for a week ----------
  function items(w){
    const T = D.terms[w.term];
    const out = { days: [], readings: [], term: [] };
    D.rhythm.forEach((blocks, di) => {
      blocks.forEach((b, bi) => { if (b) out.days.push({ id:`d${di+1}-${bi}`, day:di+1, label:'', text:b }); });
    });
    w.readings.forEach(r => out.readings.push({ id:'r-'+r.id, label:r.label, text:r.text, link:r.link }));
    const t = out.term;
    t.push({ id:'t-hymn', label:'Hymn · '+w.month, text:w.hymn.text, link:w.hymn.link, sub:[['lyrics', w.hymn.link], ['all hymns', D.links.hymns]] });
    t.push({ id:'t-folk', label:'Folksong · '+w.month, text:w.folksong.text, link:w.folksong.link, sub:[['lyrics & history', w.folksong.link]].concat(w.folksong.listen ? [['listen', w.folksong.listen]] : [], [['all folksongs', D.links.folksongs]]) });
    t.push({ id:'t-comp', label:'Composer · '+w.composer.text, text:w.composer.work, link:w.composer.link, sub:[['listen', w.composer.link], ['AO composer page', w.composer.hub]] });
    t.push({ id:'t-art', label:'Picture study · '+w.artist.text, text:w.artist.painting, link:w.artist.link, sub:[['AO artist page', w.artist.link]] });
    t.push({ id:'t-nat', label:'Nature study', text:w.nature.text, link:w.nature.link, sub:[['AO nature study', w.nature.link], ['Handbook of Nature Study', w.nature.hns]] });
    t.push({ id:'t-poem', label:'Poetry', text:w.poetry.text, link:w.poetry.link, sub:[['poems', w.poetry.link]].concat(w.poetry.link2 ? [[w.poetry.link2[0], w.poetry.link2[1]]] : []) });
    t.push({ id:'t-rec', label:'Recitation', text:w.recitation.join(' · '), link:null });
    t.push({ id:'t-geo', label:'Geography', text:w.geography[0][0], link:w.geography[0][1] });
    return out;
  }

  // ---------- render ----------
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function itemHTML(it, cls){
    const done = !!state.checks[it.id];
    const note = state.notes[it.id] || '';
    const text = it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.text)}</a>` : esc(it.text);
    const subs = it.sub ? `<div class="hint">${it.sub.map(([l,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</div>` : '';
    return `<div class="item ${cls}${done?' done':''}" data-id="${it.id}">
      <button class="chk" aria-pressed="${done}" aria-label="Mark ${esc(it.text)} done" data-act="toggle"><span class="box">${ICON_CHECK}</span></button>
      <div class="body">${it.label?`<div class="label">${esc(it.label)}</div>`:''}<div class="text">${text}</div>${subs}${note?`<div class="notepeek" data-act="edit">${esc(note)}</div>`:''}</div>
      <div class="tools">${it.link?`<a class="tb" href="${esc(it.link)}" target="_blank" rel="noopener" aria-label="Open link">${ICON_LINK}</a>`:''}<button class="tb${note?' on':''}" data-act="note" aria-label="Add a note">${ICON_NOTE}</button></div>
      <div class="note" hidden><textarea placeholder="Note…" data-act="notetext">${esc(note)}</textarea></div>
    </div>`;
  }
  function pct(st, all){
    const total = all.days.length + all.readings.length + all.term.length;
    let n = 0; [...all.days, ...all.readings, ...all.term].forEach(i => { if (st.checks[i.id]) n++; });
    return total ? Math.round(100*n/total) : 0;
  }
  function render(){
    const w = D.weeks[week-1], all = items(w);
    $('wkTitle').textContent = 'Week ' + w.week;
    $('wkSub').textContent = `${w.termName} · ${w.month} · Year 2`;
    $('prev').disabled = week === 1; $('next').disabled = week === 36;
    $('termTitle').textContent = w.termName + ' rotation';
    // days
    $('days').innerHTML = [1,2,3,4,5].map(d => {
      const blocks = all.days.filter(i => i.day === d), done = blocks.filter(i => state.checks[i.id]).length;
      return `<button class="day${d===day?' active':''}${done===blocks.length?' complete':''}" data-day="${d}">Day ${d}<small>${done}/${blocks.length}</small></button>`;
    }).join('');
    const dayItems = all.days.filter(i => i.day === day);
    $('dayList').innerHTML = dayItems.map(i => itemHTML(i, 'dayblk')).join('');
    $('dayCount').textContent = `${dayItems.filter(i => state.checks[i.id]).length} of ${dayItems.length} today`;
    $('readList').innerHTML = all.readings.map(i => itemHTML(i, 'read')).join('');
    $('readCount').textContent = `${all.readings.filter(i => state.checks[i.id]).length} of ${all.readings.length}`;
    $('termList').innerHTML = all.term.map(i => itemHTML(i, 'term')).join('');
    $('termCount').textContent = `${all.term.filter(i => state.checks[i.id]).length} of ${all.term.length}`;
    if (document.activeElement !== $('weekNote')) $('weekNote').value = state.weekNote || '';
    const p = pct(state, all);
    $('ringFill').setAttribute('stroke-dasharray', `${113.1*p/100} 113.1`);
    $('ringPct').textContent = p + '%';
    overviewCache[week] = p;
  }

  // ---------- persistence ----------
  function localKey(n){ return 'ao2.' + key(n); }
  function loadLocal(n){ try { return JSON.parse(ls(localKey(n)) || 'null') || blank(); } catch(e){ return blank(); } }
  function saveLocal(n){ ls(localKey(n), JSON.stringify(state)); }
  let writing = 0;
  async function persist(){
    saveLocal(week);
    if (!useDb) return;
    writing++; $('sync').innerHTML = 'Saving…';
    try { await famRef().collection('weeks').doc(key(week)).set({ checks: state.checks, notes: state.notes, weekNote: state.weekNote, updatedAt: new Date().toISOString() }); setSync('Synced'); }
    catch(e){ setSync('Saved on this device only (sync error)'); }
    writing--;
  }
  function setSync(t){ $('sync').innerHTML = useDb ? `<b>${t}</b> · shared with everyone who has your family link` : 'Saved on this device only'; }

  function loadWeek(n){
    week = n; ls('ao2.week', String(n));
    if (unsub) { unsub(); unsub = null; }
    state = loadLocal(n); render();
    if (!useDb) return;
    unsub = famRef().collection('weeks').doc(key(n)).onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      const d = snap.exists ? snap.data() : null;
      state = d ? { checks: Object.assign({}, d.checks||{}), notes: Object.assign({}, d.notes||{}), weekNote: d.weekNote||'' } : (snap.exists ? blank() : state);
      saveLocal(n); render(); setSync('Synced');
    }, err => setSync('Saved on this device only (sync error)'));
  }

  // ---------- events ----------
  $('prev').onclick = () => loadWeek(week-1);
  $('next').onclick = () => loadWeek(week+1);
  $('days').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (!b) return; day = +b.dataset.day; ls('ao2.day', String(day)); render(); });
  document.querySelectorAll('.list').forEach(list => {
    list.addEventListener('click', e => {
      const act = e.target.closest('[data-act]'); if (!act) return;
      const item = act.closest('.item'), id = item.dataset.id;
      if (act.dataset.act === 'toggle') { if (state.checks[id]) delete state.checks[id]; else state.checks[id] = true; render(); persist(); }
      if (act.dataset.act === 'note' || act.dataset.act === 'edit') { const n = item.querySelector('.note'); n.hidden = !n.hidden; if (!n.hidden) n.querySelector('textarea').focus(); }
    });
    list.addEventListener('input', e => {
      const ta = e.target; if (ta.dataset.act !== 'notetext') return;
      const id = ta.closest('.item').dataset.id;
      if (ta.value.trim()) state.notes[id] = ta.value; else delete state.notes[id];
      saveLocal(week);
      clearTimeout(noteTimers[id]); noteTimers[id] = setTimeout(persist, 700);
    });
    list.addEventListener('focusout', e => { if (e.target.dataset.act === 'notetext') render(); });
  });
  $('weekNote').addEventListener('input', e => { state.weekNote = e.target.value; saveLocal(week); clearTimeout(noteTimers.week); noteTimers.week = setTimeout(persist, 700); });
  $('resetWeek').onclick = () => { state.checks = {}; render(); persist(); };
  $('schedLink').href = D.links.sched;
  $('freeReads').textContent = D.freeReads.join(', ');

  // overview
  $('openOverview').onclick = async () => {
    if (useDb) { try { const qs = await famRef().collection('weeks').get(); qs.docs.forEach(d => { const n = parseInt(d.id.slice(1),10); const st = d.data(); overviewCache[n] = pct({checks: st.checks||{}}, items(D.weeks[n-1])); }); } catch(e){} }
    else { for (let n=1;n<=36;n++) overviewCache[n] = pct(loadLocal(n), items(D.weeks[n-1])); }
    let html = '';
    [1,2,3].forEach(t => {
      html += `<div class="term-lbl">${D.terms[t].name} · ${D.terms[t].weeks}</div><div class="grid">`;
      D.weeks.filter(w => w.term === t).forEach(w => { const p = overviewCache[w.week] || 0; html += `<button class="tile${w.week===week?' current':''}" data-w="${w.week}"><b>${w.week}</b><small>${w.month.slice(0,3)} · ${p}%</small><span class="bar" style="width:${p}%"></span></button>`; });
      html += '</div>';
    });
    $('ovBody').innerHTML = html; $('overview').hidden = false;
  };
  $('closeOverview').onclick = () => { $('overview').hidden = true; };
  $('ovBody').addEventListener('click', e => { const t = e.target.closest('[data-w]'); if (!t) return; $('overview').hidden = true; loadWeek(+t.dataset.w); window.scrollTo(0,0); });

  // ---------- family code ----------
  function famCode(){
    const u = new URL(location.href); let f = u.searchParams.get('f');
    if (f && /^[a-z0-9]{12,}$/.test(f)) { ls('ao2.family', f); return f; }
    f = ls('ao2.family');
    if (!f) { f = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join(''); ls('ao2.family', f); }
    u.searchParams.set('f', f); history.replaceState(null, '', u.toString());
    return f;
  }
  const FAMILY = famCode();
  function famRef(){ return db.collection('families').doc(FAMILY); }
  $('shareBtn').onclick = async () => {
    const u = new URL(location.href); u.searchParams.set('f', FAMILY);
    const data = { title: 'AO Year 2 Rhythm', text: 'Our homeschool week planner', url: u.toString() };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(u.toString()); $('shareBtn').textContent = 'Link copied'; setTimeout(() => $('shareBtn').textContent = 'Share with family', 1500); } } catch(e){}
  };

  // ---------- boot ----------
  render();
  $('sync').textContent = 'Connecting…';
  try {
    if (FIREBASE_CONFIG.apiKey === 'PASTE_ME') throw new Error('no config');
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore(); useDb = true;
    loadWeek(week);
  } catch(e) {
    useDb = false; $('sync').textContent = 'Saved on this device only (Firebase not configured)';
  }
})();
</script>
</body>
</html>
